name: packlite
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  http: ^1.6.0
  flutter_launcher_icons: ^0.13.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon_fg.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon_fg.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon_fg.png"
  min_sdk_android: 21
